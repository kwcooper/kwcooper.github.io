<style>
  .memory-404 {
    position: relative;
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    padding: 4rem 1.5rem;
  }
  .memory-404__net {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
  }
  .memory-404__net svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .node-pulse {
    fill: currentColor;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: memory-pulse 4.8s ease-in-out infinite;
    animation-fill-mode: backwards;
  }
  .edge-flicker {
    stroke: currentColor;
    stroke-linecap: round;
    fill: none;
    opacity: 0;
    animation: memory-flicker 4.8s ease-in-out infinite;
    animation-fill-mode: backwards;
  }
  @keyframes memory-pulse {
    0%, 100% { opacity: 0; transform: scale(0.7); }
    25%, 75% { opacity: 0.3; transform: scale(1.1); }
    50% { opacity: 0.55; transform: scale(1.4); }
  }
  @keyframes memory-flicker {
    0%, 100% { opacity: 0; }
    25%, 75% { opacity: 0.14; }
    50% { opacity: 0.24; }
  }
  .memory-404__content {
    position: relative;
    z-index: 1;
  }
  .memory-404 .memory-404__code {
    font-size: clamp(3.5rem, 12vw, 7rem);
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
    color: #fff;
  }
  .memory-404__title {
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    margin: 0 0 2rem;
    opacity: 0.85;
  }
  .memory-404__actions {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  @media (prefers-reduced-motion: reduce) {
    .node-pulse, .edge-flicker { animation: none; }
  }

<script>
(function () {
  var container = document.getElementById('graph-net');
  var rect = container.getBoundingClientRect();
  // Measure the real rendered box so 1 viewBox unit = 1 CSS pixel everywhere -
  // avoids the aspect-ratio mismatch that made nodes render oversized on mobile.
  var W = Math.max(1, Math.round(rect.width));
  var H = Math.max(1, Math.round(rect.height));
  var minDim = Math.min(W, H);

  // node size as a percentage of the page's smaller dimension, so it scales sanely
  // on both a wide desktop hero and a narrow phone screen
  var nodeRadius = Math.min(4.5, Math.max(2, minDim * 0.006));
  var strokeWidth = Math.max(0.6, nodeRadius * 0.28);

  var nodeCount = 11 + Math.floor(Math.random() * 6); // 11-16
  var cols = Math.ceil(Math.sqrt(nodeCount * 1.8));
  var rows = Math.ceil(nodeCount / cols);
  var cellW = W / cols, cellH = H / rows;

  // pick nodeCount distinct grid cells, then jitter within each
  var cells = [];
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) cells.push([r, c]);
  }
  for (var i = cells.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = cells[i]; cells[i] = cells[j]; cells[j] = tmp;
  }
  var chosen = cells.slice(0, nodeCount);

  var CYCLE = 4.8;
  var nodes = chosen.map(function (rc) {
    var margin = 0.22;
    var jx = margin + Math.random() * (1 - 2 * margin);
    var jy = margin + Math.random() * (1 - 2 * margin);
    return {
      x: rc[1] * cellW + jx * cellW,
      y: rc[0] * cellH + jy * cellH,
      // Negative delay = start already mid-cycle, so the graph is visible
      // immediately on load/refresh instead of everyone waiting their turn.
      delay: (-(Math.random() * CYCLE)).toFixed(2)
    };
  });

  // Minimum-spanning-tree construction (Prim's algorithm): each new node joins
  // via the shortest possible edge to whatever's already connected. This is
  // what keeps the layout looking like a clean, organic constellation instead
  // of a tangle of long random diagonals crossing the whole canvas.
  // Every non-root node still ends up with exactly one edge, sharing that
  // node's exact delay/duration, so a node and its edge fade together in lockstep.
  var edges = [];
  var connected = [0];
  var remaining = [];
  for (var n = 1; n < nodes.length; n++) remaining.push(n);

  while (remaining.length) {
    var best = { ci: -1, ri: -1, dist: Infinity };
    for (var ci = 0; ci < connected.length; ci++) {
      for (var ri = 0; ri < remaining.length; ri++) {
        var a = nodes[connected[ci]], b = nodes[remaining[ri]];
        var d = (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y);
        if (d < best.dist) best = { ci: ci, ri: ri, dist: d };
      }
    }
    var parentIdx = connected[best.ci];
    var childIdx = remaining[best.ri];
    edges.push({ a: parentIdx, b: childIdx, delay: nodes[childIdx].delay });
    connected.push(childIdx);
    remaining.splice(best.ri, 1);
  }

  var svgParts = [];
  svgParts.push('<svg viewBox="0 0 ' + W + ' ' + H + '">');
  edges.forEach(function (e) {
    var na = nodes[e.a], nb = nodes[e.b];
    // shorten each end so the line stops at the node's edge instead of its center,
    // so nothing ever pokes out past the (now-transparent-when-faded) node circle
    var dx = nb.x - na.x, dy = nb.y - na.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    var x1 = na.x + ux * nodeRadius, y1 = na.y + uy * nodeRadius;
    var x2 = nb.x - ux * nodeRadius, y2 = nb.y - uy * nodeRadius;
    svgParts.push('<line class="edge-flicker" style="animation-delay:' + e.delay + 's; stroke-width:' + strokeWidth.toFixed(2) + '" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" />');
  });
  nodes.forEach(function (n) {
    svgParts.push('<circle class="node-pulse" style="animation-delay:' + n.delay + 's" cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) + '" r="' + nodeRadius.toFixed(2) + '" />');
  });
  svgParts.push('</svg>');

  container.innerHTML = svgParts.join('');
})();
</script>
